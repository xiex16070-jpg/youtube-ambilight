<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>YouTube™ 与哔哩哔哩氛围灯设置</title>
  <link rel="stylesheet" href="styles/options.css">
</head>

<body>
  <main>
    <h1>YouTube™ 与哔哩哔哩氛围灯</h1>
    <p>
      支持 YouTube™ 和哔哩哔哩（www.bilibili.com）视频页面。<br/><br/>
      也可以在视频播放器中打开设置：<br/><br/>
      <img src="images/settings-moved-to.png" alt="播放器中氛围灯设置入口的位置示意图" />
    </p>
    
    <h2>没有看到设置按钮</h2>
    <p>
      请刷新浏览器中的网页。<br/><br/>
      <i>如果刷新后仍未显示设置按钮，请按 F12 打开浏览器控制台，查找错误或警告，并通过以下方式反馈：<br/>
      <a href="https://github.com/WesselKroos/youtube-ambilight/issues" target="_blank">提交问题</a>
      或
      <a id="feedbackFormLink" href="https://docs.google.com/forms/d/1OU7e3fOXk2NJSppCj4hrAE0lUgi8utccdooX1rUnycU" target="_blank">填写反馈表</a>
      </i>
    </p>
    <h2>解决性能问题</h2>
    <p>
      请参阅<a href="https://github.com/xiex16070-jpg/youtube-ambilight/blob/main/TROUBLESHOOT.zh-CN.md" target="_blank">性能问题排查指南</a>。
    </p>

    <h2>支持作者</h2>
    <p>
      <a class="donate-link" href="https://github.com/xiex16070-jpg/youtube-ambilight#-%E6%94%AF%E6%8C%81%E4%BD%9C%E8%80%85" target="_blank" rel="noopener">
        <img src="images/donate.svg" alt="支持作者" title="支持作者" height="33" />
      </a>
    </p>

    <h2>导入／导出设置</h2>
    <div id="importExportStatus" class="import-export-status"></div>
    <div id="importExportStatusDetails" class="import-export-status-details" tabindex="0"></div>
    <h3>文件</h3>
    <p>
      <button id="exportFileBtn">导出到文件</button>
      <button id="importFileBtn">从文件导入</button>
      <input hidden name="import-settings-file" type="file" accept=".json"/>
    </p>
    <h3>云端存储（浏览器账号）</h3>
    <p>
      <button id="exportAccountBtn">导出到云端</button>
      <button id="importAccountBtn" disabled>从云端导入</button>
    </p>
    <p>
      <div id="importableAccountStatus" class="importable-account-status"></div>
    </p>

    <h2>隐私</h2>
    <p>
      此版本不会收集或发送任何数据，不含崩溃上报、分析统计或远程代码。<br/>
      所有设置仅保存在浏览器本地，不会离开你的设备。<br/>
    </p>

    <div class="warnings-container"></div>

    <p>
      <a id="privacyPolicyLink" href="#" target="_blank">隐私政策</a>
    </p>
  </main>
  <script src="scripts/options.js"></script>
</body>
</html>
